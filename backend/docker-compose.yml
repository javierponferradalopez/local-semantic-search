name: local-semantic-search

services:
  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: local_semantic_search
      POSTGRES_PASSWORD: local_semantic_search
      POSTGRES_DB: local_semantic_search
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username local_semantic_search --dbname local_semantic_search
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
